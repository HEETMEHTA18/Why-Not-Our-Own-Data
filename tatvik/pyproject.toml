[project]
name = "tatvik-runtime"
version = "0.1.0"
description = "AI Runtime & Training Platform for Project Tatvik"
requires-python = ">=3.11"

[project.optional-dependencies]
training = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.45.0",
    "unsloth>=2024.11.0",
    "trl>=0.13.0",
    "datasets>=3.1.0",
    "accelerate>=1.2.0",
]
evaluation = [
    "lm-eval==0.4.8",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
